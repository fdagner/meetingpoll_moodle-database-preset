</div><!-- /tf-entries -->
</div><!-- /tf-list-wrap -->

<script>
(() => {
  'use strict';

  const STATUS_INFO = new Map([
    ['yes', { symbol: '\u2713', ariaLabel: 'Kann', cls: 'bg-success text-white' }],
    ['maybe', { symbol: '?', ariaLabel: 'Vielleicht', cls: 'bg-warning text-dark' }],
    ['no', { symbol: '\u2717', ariaLabel: 'Kann nicht', cls: 'bg-danger text-white' }]
  ]);

  const ALL_DAY_LABEL = 'ganztg.';
  const isAllDay = (dateTime) => !dateTime.includes('T');

  const formatDay = (isoDay) => {
    const [year, month, day] = isoDay.split('-');
    return `${day}.${month}.${year}`;
  };

  const target = document.getElementById('tf-list-table');
  if (!target) return;

  // .textContent is used for jsonEl because [[json]] is stored, user-supplied
  // data - it must never be interpreted as HTML. userEl and actionsEl, by
  // contrast, come from Moodle's own ##user##/##more##/##edit##/##delete##
  // placeholders: server-rendered, already-escaped markup (##user## includes
  // the link to the user's profile), so both are safe to reinsert via
  // innerHTML - and doing so is required to keep the profile link intact.
  const entries = [...document.querySelectorAll('#tf-entries .tf-entry')].map((entryEl) => {
    const userEl = entryEl.querySelector('.tf-user');
    const jsonEl = entryEl.querySelector('.tf-json');
    const noteEl = entryEl.querySelector('.tf-note');
    const actionsEl = entryEl.querySelector('.tf-actions');

    const userHtml = userEl ? userEl.innerHTML.trim() : '';
    const jsonText = jsonEl ? jsonEl.textContent.trim() : '';
   const noteHtml = noteEl ? noteEl.innerHTML.trim() : '';
    const actionsHtml = actionsEl ? actionsEl.innerHTML.trim() : '';

    let answers = {};
    try {
      answers = JSON.parse(jsonText) || {};
    } catch (parseError) {
      answers = {};
    }

    return { userHtml, noteHtml, answers, actionsHtml };
  });

  // ---- E-Mail-Vorlage --------------------------------------------------
  // Bewusst UNABHAENGIG von vorhandenen Eintraegen: gerade beim allerersten
  // Aufruf (noch 0 Rueckmeldungen) wird der Einladungstext ja gebraucht, um
  // ueberhaupt die erste Rueckmeldung zu bekommen. Nur die Tabelle weiter
  // unten braucht mindestens 1 Eintrag, um sinnvoll zu sein.
  // Die Links werden aus der aktuellen Seiten-URL abgeleitet, statt einen
  // festen Wert zu hinterlegen, damit sie auf jeder Moodle-Instanz und bei
  // jedem Datensatz automatisch stimmen. Moodle erzeugt die eigenen Links
  // dieser Aktivität mit dem Parameter "d" (bzw. teils "id"); view.php und
  // edit.php akzeptieren beide denselben Parameter, daher reicht es, den
  // Dateinamen zu tauschen und alle listen-spezifischen Parameter
  // (mode/sort/order/page ...) fuer den "Hinzufuegen"-Link zu entfernen.
  const mailTemplateTarget = document.getElementById('tf-mail-template');
  if (mailTemplateTarget) {
    const overviewUrl = new URL(window.location.href);
    // Anzeige-Modus/Sortierung sind fuer die Uebersicht selbst erwuenscht,
    // aber nicht Teil des zu teilenden Links - der Link soll einfach auf die
    // Listenansicht fuehren.
    const overviewLink = overviewUrl.origin + overviewUrl.pathname +
      (overviewUrl.searchParams.has('d') ? `?d=${overviewUrl.searchParams.get('d')}` :
       overviewUrl.searchParams.has('id') ? `?id=${overviewUrl.searchParams.get('id')}` :
       overviewUrl.search);

    const addUrl = new URL(window.location.href);
    addUrl.pathname = addUrl.pathname.replace('view.php', 'edit.php');
    [...addUrl.searchParams.keys()].forEach((key) => {
      if (key !== 'd' && key !== 'id') addUrl.searchParams.delete(key);
    });
    const addLink = addUrl.href;

    const mailText = 'Hallo zusammen,\n' +
      'bitte tragt eure Verf\u00fcgbarkeit f\u00fcr die vorgeschlagenen Termine ein:\n' +
      addLink + '\n\n' +
      'Die aktuelle \u00dcbersicht aller R\u00fcckmeldungen seht ihr hier:\n' +
      overviewLink + '\n\n' +
      'Danke euch!';

    mailTemplateTarget.innerHTML =
      '<div class="card"><div class="card-body">' +
      '<h6 class="card-title mb-2"><i class="fa-regular fa-envelope me-1"></i>E-Mail-Vorlage zum Kopieren</h6>' +
      '<textarea id="tf-mail-textarea" class="form-control mb-2" rows="7" readonly></textarea>' +
      '<button type="button" class="btn btn-outline-secondary btn-sm" id="tf-mail-copy-btn">' +
      '<i class="fa-regular fa-copy me-1"></i>Text kopieren</button>' +
      '<span id="tf-mail-copy-feedback" class="text-success small ms-2 d-none">Kopiert!</span>' +
      '</div></div>';
    mailTemplateTarget.classList.remove('d-none');

    // .value statt innerHTML: mailText enthaelt URL-Bestandteile aus
    // window.location, die so oder so nicht als HTML interpretiert werden.
    const mailTextarea = document.getElementById('tf-mail-textarea');
    if (mailTextarea) mailTextarea.value = mailText;

    const copyBtn = document.getElementById('tf-mail-copy-btn');
    const copyFeedback = document.getElementById('tf-mail-copy-feedback');
    if (copyBtn && mailTextarea) {
      copyBtn.addEventListener('click', () => {
        const showFeedback = () => {
          if (!copyFeedback) return;
          copyFeedback.classList.remove('d-none');
          window.setTimeout(() => copyFeedback.classList.add('d-none'), 2000);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(mailTextarea.value).then(showFeedback, () => {
            mailTextarea.select();
            document.execCommand('copy');
            showFeedback();
          });
        } else {
          mailTextarea.select();
          document.execCommand('copy');
          showFeedback();
        }
      });
    }
  }

  if (entries.length === 0) {
    target.innerHTML = '<p class="text-muted">Noch keine R\u00fcckmeldungen vorhanden.</p>';
    return;
  }

  // Collect every appointment that appears in at least one entry.
  const dateSet = new Set();
  entries.forEach((entry) => Object.keys(entry.answers).forEach((dateTime) => dateSet.add(dateTime)));
  const dateList = [...dateSet].sort();

  if (dateList.length === 0) {
    target.innerHTML = '<p class="text-muted">Noch keine Termine hinterlegt.</p>';
    return;
  }

  // Group by calendar day so same-day slots share one header cell.
  const dayGroups = new Map();
  for (const dateTime of dateList) {
    const day = dateTime.split('T')[0];
    if (!dayGroups.has(day)) dayGroups.set(day, []);
    dayGroups.get(day).push(dateTime);
  }
  const dayKeys = [...dayGroups.keys()].sort();

  // Count "yes" answers per slot to highlight the best-fitting appointment(s).
  const yesCounts = new Map(dateList.map((dateTime) => [dateTime, 0]));
  entries.forEach((entry) => {
    dateList.forEach((dateTime) => {
      if (entry.answers[dateTime] === 'yes') {
        yesCounts.set(dateTime, yesCounts.get(dateTime) + 1);
      }
    });
  });
  const maxYesCount = Math.max(0, ...yesCounts.values());

  const headerDayCells = dayKeys.map((day) =>
    `<th colspan="${dayGroups.get(day).length}" class="text-center">${formatDay(day)}</th>`
  ).join('');

  const headerTimeCells = dayKeys.map((day) =>
    dayGroups.get(day).map((dateTime) => {
      const bestCls = maxYesCount > 0 && yesCounts.get(dateTime) === maxYesCount ? ' tf-best' : '';
      const label = isAllDay(dateTime)
        ? `<span class="fst-italic">${ALL_DAY_LABEL}</span>`
        : dateTime.split('T')[1];
      return `<th class="text-center${bestCls}">${label}</th>`;
    }).join('')
  ).join('');

  const bodyRows = entries.map((entry, rowIndex) => {
    const nameCell = `<td>${entry.userHtml || '\u2014'}</td>`;
    const answerCells = dateList.map((dateTime) => {
      const status = STATUS_INFO.get(entry.answers[dateTime]);
      if (status) {
        return `<td class="text-center ${status.cls}" title="${status.ariaLabel}" aria-label="${status.ariaLabel}">${status.symbol}</td>`;
      }
      return '<td class="text-center text-muted" title="offen">\u2013</td>';
    }).join('');
    const noteCell = entry.noteHtml
      ? `<td class="tf-note-cell text-center"><button type="button" class="btn btn-outline-info btn-sm tf-note-btn" ` +
        `data-note-index="${rowIndex}" title="Notiz anzeigen" aria-label="Notiz anzeigen">` +
        `<i class="fa-regular fa-comment"></i></button></td>`
      : '<td class="tf-note-cell"></td>';
    // actionsHtml comes from Moodle itself (see comment above), not from entry text.
    return `<tr>${nameCell}${noteCell}${answerCells}<td class="tf-actions-cell">${entry.actionsHtml}</td></tr>`;
  }).join('');

  // Each count in the "Anzahl" row is a button that opens the iCal modal
  // for that appointment, so the best-fitting slot can be exported directly.
  const summaryCells = dateList.map((dateTime) => {
    const isBest = maxYesCount > 0 && yesCounts.get(dateTime) === maxYesCount;
    const bestCls = isBest ? ' tf-best' : '';
    const count = yesCounts.get(dateTime);
    const label = isBest ? `\u2605 ${count}` : `${count}`;
    return `<td class="text-center fw-bold${bestCls}">` +
      `<button type="button" class="btn btn-link btn-sm p-0 fw-bold tf-ical-btn" data-datetime="${dateTime}" ` +
      `title="Termin als Kalendereintrag exportieren">${label}</button>` +
      `</td>`;
  }).join('');

  target.innerHTML =
    '<table class="table table-bordered table-sm tf-list-table align-middle">' +
    `<thead><tr><th>Teilnehmer/in</th><th>Notiz</th>${headerDayCells}<th>Aktion</th></tr>` +
    `<tr><th></th><th></th>${headerTimeCells}<th></th></tr></thead>` +
    `<tbody>${bodyRows}<tr class="tf-summary"><td class="fw-bold">Anzahl</td><td></td>${summaryCells}<td></td></tr></tbody>` +
    '</table>';

  // Generic manual modal controller (Moodle ships Bootstrap's CSS but not its
  // JS bundle, so bootstrap.Modal is not available here). Shown/hidden by
  // toggling the same CSS classes Bootstrap itself would use (.modal.show +
  // a backdrop). Used for both the iCal-export modal and the note modal.
  function createModalController(modalEl) {
    let backdropEl = null;

    function open() {
      if (!backdropEl) {
        backdropEl = document.createElement('div');
        backdropEl.className = 'modal-backdrop show';
        backdropEl.addEventListener('click', close);
        document.body.appendChild(backdropEl);
      }
      modalEl.style.display = 'block';
      modalEl.classList.add('show');
      modalEl.removeAttribute('aria-hidden');
      modalEl.setAttribute('aria-modal', 'true');
      document.body.classList.add('modal-open');
      document.addEventListener('keydown', onEscapePress);
    }

    function close() {
      modalEl.style.display = 'none';
      modalEl.classList.remove('show');
      modalEl.setAttribute('aria-hidden', 'true');
      modalEl.removeAttribute('aria-modal');
      document.body.classList.remove('modal-open');
      if (backdropEl) {
        backdropEl.remove();
        backdropEl = null;
      }
      document.removeEventListener('keydown', onEscapePress);
    }

    function onEscapePress(event) {
      if (event.key === 'Escape') close();
    }

    modalEl.querySelectorAll('[data-tf-dismiss]').forEach((el) => {
      el.addEventListener('click', close);
    });

    return { open, close };
  }

  // ---- iCal export modal -------------------------------------------------
  let modalEl = document.getElementById('tf-ical-modal');
  if (!modalEl) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML =
      '<div class="modal" id="tf-ical-modal" tabindex="-1" aria-labelledby="tf-ical-modal-label" aria-hidden="true" style="display:none;">' +
      '<div class="modal-dialog">' +
      '<div class="modal-content">' +
      '<div class="modal-header">' +
      '<h5 class="modal-title" id="tf-ical-modal-label">Termin zum Kalender hinzuf\u00fcgen</h5>' +
      '<button type="button" class="btn-close" data-tf-dismiss aria-label="Schlie\u00dfen"></button>' +
      '</div>' +
      '<div class="modal-body">' +
      '<p class="mb-3"><strong>Datum:</strong> <span id="tf-ical-date"></span><br>' +
      '<strong>Uhrzeit:</strong> <span id="tf-ical-time"></span></p>' +
      '<div class="mb-3">' +
      '<label for="tf-ical-title" class="form-label">Titel des Termins</label>' +
      '<input type="text" class="form-control" id="tf-ical-title" placeholder="z.\u00A0B. Meeting">' +
      '</div>' +
      '<div class="mb-3" id="tf-ical-duration-group">' +
      '<label for="tf-ical-duration" class="form-label">Dauer (Minuten)</label>' +
      '<input type="number" class="form-control" id="tf-ical-duration" value="60" min="5" step="5">' +
      '</div>' +
      '<div class="mb-3">' +
      '<label for="tf-ical-location" class="form-label">Ort</label>' +
      '<input type="text" class="form-control" id="tf-ical-location" placeholder="z.\u00A0B. Raum 204">' +
      '</div>' +
      '</div>' +
      '<div class="modal-footer">' +
      '<button type="button" class="btn btn-secondary" data-tf-dismiss>Abbrechen</button>' +
      '<button type="button" class="btn btn-primary" id="tf-ical-export">' +
      '<i class="fa-regular fa-calendar-plus me-1"></i>iCal exportieren</button>' +
      '</div></div></div></div>';
    document.body.appendChild(wrapper.firstElementChild);
    modalEl = document.getElementById('tf-ical-modal');
  }

  const icalModalCtrl = createModalController(modalEl);

  const dateEl = document.getElementById('tf-ical-date');
  const timeEl = document.getElementById('tf-ical-time');
  const titleInput = document.getElementById('tf-ical-title');
  const durationInput = document.getElementById('tf-ical-duration');
  const durationGroup = document.getElementById('tf-ical-duration-group');
  const locationInput = document.getElementById('tf-ical-location');
  const exportBtn = document.getElementById('tf-ical-export');

  let activeDateTime = null;

  const pad = (n) => String(n).padStart(2, '0');
  const toIcsDate = (isoDay) => isoDay.replace(/-/g, '');

  const escapeIcsText = (value) => String(value)
    .replace(/\\/g, '\\\\')
    .replace(/;/g, '\\;')
    .replace(/,/g, '\\,')
    .replace(/\n/g, '\\n');

  const addOneDay = (isoDay) => {
    const [y, m, d] = isoDay.split('-').map(Number);
    const date = new Date(Date.UTC(y, m - 1, d));
    date.setUTCDate(date.getUTCDate() + 1);
    return `${date.getUTCFullYear()}${pad(date.getUTCMonth() + 1)}${pad(date.getUTCDate())}`;
  };

  document.querySelectorAll('.tf-ical-btn').forEach((button) => {
    button.addEventListener('click', () => {
      activeDateTime = button.dataset.datetime;
      const day = activeDateTime.split('T')[0];
      const allDay = isAllDay(activeDateTime);

      dateEl.textContent = formatDay(day);
      if (allDay) {
        timeEl.textContent = ALL_DAY_LABEL;
        durationGroup.classList.add('d-none');
      } else {
        timeEl.textContent = `${activeDateTime.split('T')[1]} Uhr`;
        durationGroup.classList.remove('d-none');
      }
      titleInput.value = '';
      locationInput.value = '';

      icalModalCtrl.open();
      window.setTimeout(() => titleInput.focus(), 50);
    });
  });

  exportBtn.addEventListener('click', () => {
    if (!activeDateTime) return;
    const title = titleInput.value.trim() || 'Termin';
    const location = locationInput.value.trim();
    const day = activeDateTime.split('T')[0];
    const allDay = isAllDay(activeDateTime);

    let dtStartLine;
    let dtEndLine;
    if (allDay) {
      dtStartLine = `DTSTART;VALUE=DATE:${toIcsDate(day)}`;
      dtEndLine = `DTEND;VALUE=DATE:${addOneDay(day)}`;
    } else {
      const [hh, mm] = activeDateTime.split('T')[1].split(':').map(Number);
      const durationMinutes = Math.max(5, parseInt(durationInput.value, 10) || 60);
      const startDate = new Date(day + 'T' + activeDateTime.split('T')[1] + ':00');
      const endDate = new Date(startDate.getTime() + durationMinutes * 60000);
      const endIsoDay = `${endDate.getFullYear()}-${pad(endDate.getMonth() + 1)}-${pad(endDate.getDate())}`;
      dtStartLine = `DTSTART:${toIcsDate(day)}T${pad(hh)}${pad(mm)}00`;
      dtEndLine = `DTEND:${toIcsDate(endIsoDay)}T${pad(endDate.getHours())}${pad(endDate.getMinutes())}00`;
    }

    const now = new Date();
    const dtStamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCDate())}` +
      `T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
    const uid = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`) +
      '@terminfinder';

    const icsLines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Terminfinder//DE',
      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${dtStamp}`,
      dtStartLine,
      dtEndLine,
      `SUMMARY:${escapeIcsText(title)}`
    ];
    if (location) icsLines.push(`LOCATION:${escapeIcsText(location)}`);
    icsLines.push('END:VEVENT', 'END:VCALENDAR');
    const icsContent = icsLines.join('\r\n');

    const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `Termin_${toIcsDate(day)}.ics`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);

    icalModalCtrl.close();
  });

  // ---- Note modal ---------------------------------------------------------
  let noteModalEl = document.getElementById('tf-note-modal');
  if (!noteModalEl) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML =
      '<div class="modal" id="tf-note-modal" tabindex="-1" aria-labelledby="tf-note-modal-label" aria-hidden="true" style="display:none;">' +
      '<div class="modal-dialog">' +
      '<div class="modal-content">' +
      '<div class="modal-header">' +
      '<h5 class="modal-title" id="tf-note-modal-label"><i class="fa-regular fa-comment me-2"></i>Notiz</h5>' +
      '<button type="button" class="btn-close" data-tf-dismiss aria-label="Schlie\u00dfen"></button>' +
      '</div>' +
      '<div class="modal-body">' +
      '<p id="tf-note-modal-text" class="mb-0"></p>' +
      '</div>' +
      '<div class="modal-footer">' +
      '<button type="button" class="btn btn-secondary" data-tf-dismiss>Schlie\u00dfen</button>' +
      '</div></div></div></div>';
    document.body.appendChild(wrapper.firstElementChild);
    noteModalEl = document.getElementById('tf-note-modal');
  }

  const noteModalCtrl = createModalController(noteModalEl);
  const noteModalTextEl = document.getElementById('tf-note-modal-text');

  document.querySelectorAll('.tf-note-btn').forEach((button) => {
    button.addEventListener('click', () => {
      const entry = entries[Number(button.dataset.noteIndex)];
      if (!entry || !noteModalTextEl) return;
      noteModalTextEl.innerHTML = entry.noteHtml;
      noteModalCtrl.open();
    });
  });
})();
</script>
