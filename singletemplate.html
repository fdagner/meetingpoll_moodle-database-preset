<div class="tf-single mb-3">
<h5 class="mb-2">Rückmeldung von ##user##</h5>
<div id="tf-single-json" class="d-none">[[json]]</div>
<div id="tf-single-table" class="table-responsive"></div>
</div>

<div class=" added_field">
    <div class="mt-4">
        <span class="fw-bold">[[note#description]]</span>
        <p class="mt-2">[[note]]</p>
    </div>
</div>

<script>
(() => {
  'use strict';

  const STATUS_INFO = new Map([
    ['yes', { symbol: '\u2713', ariaLabel: 'Kann', cls: 'bg-success text-white' }],
    ['maybe', { symbol: '?', ariaLabel: 'Vielleicht', cls: 'bg-warning text-dark' }],
    ['no', { symbol: '\u2717', ariaLabel: 'Kann nicht', cls: 'bg-danger text-white' }]
  ]);

  const ALL_DAY_LABEL = 'ganzt\u00e4gig';

  const formatDay = (isoDay) => {
    const [year, month, day] = isoDay.split('-');
    return `${day}.${month}.${year}`;
  };

  const jsonEl = document.getElementById('tf-single-json');
  const target = document.getElementById('tf-single-table');
  if (!jsonEl || !target) return;

  let answers = {};
  try {
    answers = JSON.parse(jsonEl.textContent.trim() || '{}') || {};
  } catch (parseError) {
    answers = {};
  }

  const dateList = Object.keys(answers).sort();
  if (dateList.length === 0) {
    target.innerHTML = '<p class="text-muted">Keine Angaben vorhanden.</p>';
    return;
  }

  const rows = dateList.map((dateTime) => {
    const [day, time] = dateTime.split('T');
    const timeLabel = time ? time : `<span class="fst-italic">${ALL_DAY_LABEL}</span>`;
    const status = STATUS_INFO.get(answers[dateTime]);
    const answerCell = status
      ? `<td class="${status.cls}" title="${status.ariaLabel}" aria-label="${status.ariaLabel}">${status.symbol}</td>`
      : '<td class="text-muted">offen</td>';
    return `<tr><td>${formatDay(day)}</td><td>${timeLabel}</td>${answerCell}</tr>`;
  }).join('');

  target.innerHTML =
    '<table class="table table-bordered table-sm align-middle">' +
    '<thead><tr><th>Tag</th><th>Uhrzeit</th><th>Antwort</th></tr></thead>' +
    `<tbody>${rows}</tbody></table>`;
})();
</script>
